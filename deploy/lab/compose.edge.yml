# Lab role: edge — the MEC application server behind the UPF.
#
# Hosts the Zenoh router (the rendezvous point the UE dials into) and the
# ingest node that stamps arrival and computes latency.
#
# The admin service used to live here. It moved to infra: runs are per cell,
# and a control plane on the edge means one authority PER cell rather than one
# for the fleet — two registries, two runs/ directories, two halves of a
# declared topology, and no way to start a run that spans cells.
#
# Required env: INFRA_HOST — the infra host, which serves both the
# logging service (:8000) and the admin (:8099). RUN_ID is required only
# without the admin: with ADMIN_URL set the admin names the runs.
services:
  zenoh-router:
    image: mec-cast-ros
    build:
      context: ../..
      dockerfile: deploy/docker/ros.Dockerfile
      # Stamped into the image's OCI labels and its runtime environment, so a
      # host can say what it is running and the admin can compare. deploy.sh
      # forwards these; a hand-run build without them gets `unknown`.
      args:
        VCS_REF: ${VCS_REF:-unknown}
        VERSION: ${VERSION:-unknown}
    network_mode: host
    command: ros2 run rmw_zenoh_cpp rmw_zenohd
    environment:
      ZENOH_ROUTER_CONFIG_URI: /zenoh/router-config.json5
    restart: unless-stopped

  edge:
    image: mec-cast-ros
    network_mode: host
    # PUBLISH_RESULT sends the processed cloud back down for the UE's
    # renderer. Off unless asked for: it changes what the edge does with
    # every frame, and campaigns recorded without it must stay comparable.
    # publish_result is passed as an ENV VAR, not as `-p publish_result:=`.
    # A ROS parameter is typed: `-p publish_result:=1` makes rclpy read an
    # INTEGER against a BOOL default and the node dies at declare_parameter
    # with InvalidParameterTypeException -- while `PUBLISH_RESULT=1` is what
    # every doc, and deploy/compose/render.yml, tells an operator to set. The
    # node's own default parses the variable leniently (`1`, `true`, any
    # case), so handing it the variable accepts all of those and the typed
    # parameter accepts only two of them.
    command: >
      ros2 run mec_cast_edge edge --ros-args
      -p result_reliability:=${RESULT_RELIABILITY:-best_effort}
      -p result_qos_depth:=${RESULT_QOS_DEPTH:-1}
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_SESSION_CONFIG_URI: /zenoh/session-config.json5
      # The session config dials `zenoh-router` by SERVICE NAME, which only
      # resolves on a compose bridge network. This role is network_mode: host,
      # where there is no compose DNS, so the node died at rclpy.init() with
      # "failed to lookup address information: Temporary failure in name
      # resolution" -- a DNS error for a router running on the same machine.
      #
      # The router is local to this host, so dial the loopback. Override
      # rather than editing the session file: ZENOH_CONFIG_OVERRIDE MERGES,
      # while the file replaces rmw_zenoh's packaged defaults outright. The UE
      # and gNB do the same thing pointing at EDGE_HOST.
      ZENOH_CONFIG_OVERRIDE: 'connect/endpoints=["udp/127.0.0.1:7447?rel=1"]'
      ZENOH_ROUTER_CHECK_ATTEMPTS: "-1"
      PUBLISH_RESULT: ${PUBLISH_RESULT:-}
      RUN_ID: ${RUN_ID:-}
      RUNS_DIR: /runs
      LOGGING_URL: http://${INFRA_HOST:?set INFRA_HOST}:8000
      # Which radio cell this node reports. Empty unless the deployment
      # declares a topology; see docs/operations/admin-service.md.
      CELL: ${CELL:-}
      # Always the in-container path: the bind mount above maps whatever the
      # host calls its PHC onto /dev/ptp0 here. Empty would disable the
      # monitor, which is what shipped for the platform's whole life.
      PTP_DEVICE: /dev/ptp0
      # `-` not `:-`: an explicitly empty ADMIN_URL means "no control
      # plane, take the run id from RUN_ID", and `:-` cannot express
      # that because it substitutes the default for empty as well as
      # unset. See operations/deploy-manual.md.
      ADMIN_URL: ${ADMIN_URL-ws://${INFRA_HOST:?set INFRA_HOST}:8099/ws/node}
    volumes:
      - ../../runs:/runs
    devices:
      # The host PHC, always presented as /dev/ptp0 INSIDE the container, so
      # only this line is host-specific and the node's config is uniform.
      # Default index 0 is whichever NIC the driver registered first, which on
      # a multi-NIC host is routinely not the one ptp4l disciplines -- set
      # PTP_DEVICE per host to the right clock (`ethtool -T <iface>` names the
      # index). An explicit target is required: the single-path form maps
      # host:host, leaving the container without the path it was told to open.
      - ${PTP_DEVICE:-/dev/ptp0}:/dev/ptp0
    depends_on:
      - zenoh-router
