# Lab role: edge — the MEC application server behind the UPF.
#
# Hosts the middleware's centre -- the Zenoh router, or the Fast DDS Discovery
# Server, per MIDDLEWARE (ADR-0013) -- and the ingest node that stamps arrival
# and computes latency.
#
# The admin service used to live here. It moved to infra: runs are per zone,
# and a control plane on the edge means one authority PER zone rather than one
# for the fleet — two registries, two runs/ directories, two halves of a
# declared topology, and no way to start a run that spans cells.
#
# Optional: MIDDLEWARE (zenoh | dds), MIDDLEWARE_LINK (zenoh: tcp | quic;
# dds: udp | tcp) -- the same on every host. deploy.sh sets COMPOSE_PROFILES.
#
# Required env: INFRA_HOST — the infra host, which serves both the
# logging service (:8000) and the admin (:8099). RUN_ID is required only
# without the admin: with ADMIN_URL set the admin names the runs.
services:
  zenoh-router:
    image: mec-cast-ros
    build:
      context: ../..
      dockerfile: deploy/docker/ros.Dockerfile
      # Stamped into the image's OCI labels and its runtime environment, so a
      # host can say what it is running and the admin can compare. deploy.sh
      # forwards these; a hand-run build without them gets `unknown`.
      args:
        VCS_REF: ${VCS_REF:-unknown}
        VERSION: ${VERSION:-unknown}
        # No rerun on this role. Only mec_cast_render imports it and the edge
        # never runs a renderer, but the image defaults to WITH_RERUN=1 and
        # nothing had ever set it otherwise -- so every edge host carried
        # 447 MB (rerun_sdk 253 MB + rerun_bindings 193 MB) it cannot use.
        # deploy.sh builds per host, so the UE keeps its copy.
        WITH_RERUN: "0"
    network_mode: host
    profiles: [zenoh]
    command: /middleware/middleware-server.sh zenoh
    environment:
      ZENOH_ROUTER_CONFIG_URI: /zenoh/router-config.json5
      MIDDLEWARE_LINK: ${MIDDLEWARE_LINK:-tcp}
    restart: unless-stopped

  # The Fast DDS Discovery Server: the DDS counterpart of the router above,
  # when MIDDLEWARE=dds. Discovery goes through it; data then flows directly
  # between the UE's and this edge's participants, so the UE address must be
  # routable from here (no NAT at the UPF).
  dds-discovery:
    image: mec-cast-ros
    # The edge image's build, as on zenoh-router: whichever centre is active
    # builds it.
    build:
      context: ../..
      dockerfile: deploy/docker/ros.Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
        VERSION: ${VERSION:-unknown}
        WITH_RERUN: "0"
    network_mode: host
    profiles: [dds]
    command: /middleware/middleware-server.sh dds
    environment:
      MIDDLEWARE: dds
      MIDDLEWARE_LINK: ${MIDDLEWARE_LINK:-udp}
    restart: unless-stopped

  edge:
    image: mec-cast-ros
    network_mode: host
    # PUBLISH_RESULT sends the processed cloud back down for the UE's
    # renderer. Off unless asked for: it changes what the edge does with
    # every frame, and campaigns recorded without it must stay comparable.
    # publish_result is passed as an ENV VAR, not as `-p publish_result:=`.
    # A ROS parameter is typed: `-p publish_result:=1` makes rclpy read an
    # INTEGER against a BOOL default and the node dies at declare_parameter
    # with InvalidParameterTypeException -- while `PUBLISH_RESULT=1` is what
    # every doc, and deploy/compose/render.yml, tells an operator to set. The
    # node's own default parses the variable leniently (`1`, `true`, any
    # case), so handing it the variable accepts all of those and the typed
    # parameter accepts only two of them.
    command: >
      ros2 run mec_cast_edge edge --ros-args
      -p result_reliability:=${RESULT_RELIABILITY:-best_effort}
      -p result_qos_depth:=${RESULT_QOS_DEPTH:-1}
    environment:
      # Zenoh (tcp|quic) or Fast DDS (udp|tcp), the same on every host of
      # the deployment, resolved by the image's entrypoint (ADR-0013,
      # docs/architecture/middleware.md). Either way a star: Zenoh clients of
      # the router beside this node, or Fast DDS clients of the Discovery
      # Server beside it.
      #
      # Loopback, because the centre runs beside this node under
      # network_mode: host. A service name resolves only on a compose bridge
      # network, and this role has no compose DNS -- the node died at
      # rclpy.init() with "failed to lookup address information" for a router
      # on the same machine.
      MIDDLEWARE: ${MIDDLEWARE:-zenoh}
      MIDDLEWARE_LINK: ${MIDDLEWARE_LINK:-}
      MIDDLEWARE_HOST: 127.0.0.1
      # dds/tcp: this edge listens, the UE's participants dial out to it.
      DDS_TCP_LISTEN_PORT: "7410"
      # dds: the N6 address only. Fast DDS announces every interface, and on
      # a host also on the management LAN the data could bypass 5G.
      DDS_INTERFACES: ${DDS_INTERFACES:-}
      PUBLISH_RESULT: ${PUBLISH_RESULT:-}
      # none | gpcc (ADR-0014): the downlink G-PCC coded. A run's `codec`
      # parameter overrides it; this is the default without the admin.
      CODEC: ${CODEC:-}
      RUN_ID: ${RUN_ID:-}
      RUNS_DIR: /runs
      LOGGING_URL: http://${INFRA_HOST:?set INFRA_HOST}:8000
      # Which zone (a gNB, its UEs and its edge) this node reports. Empty
      # unless the deployment declares a topology; see
      # docs/operations/admin-service.md.
      ZONE: ${ZONE:-}
      # Always the in-container path: the bind mount above maps whatever the
      # host calls its PHC onto /dev/ptp0 here. Empty would disable the
      # monitor, which is what shipped for the platform's whole life.
      PTP_DEVICE: /dev/ptp0
      # `-` not `:-`: an explicitly empty ADMIN_URL means "no control
      # plane, take the run id from RUN_ID", and `:-` cannot express
      # that because it substitutes the default for empty as well as
      # unset. See operations/deploy-manual.md.
      ADMIN_URL: ${ADMIN_URL-ws://${INFRA_HOST:?set INFRA_HOST}:8099/ws/node}
    volumes:
      - ../../runs:/runs
    devices:
      # The host PHC, always presented as /dev/ptp0 INSIDE the container, so
      # only this line is host-specific and the node's config is uniform.
      # Default index 0 is whichever NIC the driver registered first, which on
      # a multi-NIC host is routinely not the one ptp4l disciplines -- set
      # PTP_DEVICE per host to the right clock (`ethtool -T <iface>` names the
      # index). An explicit target is required: the single-path form maps
      # host:host, leaving the container without the path it was told to open.
      - ${PTP_DEVICE:-/dev/ptp0}:/dev/ptp0
    depends_on:
      # Only the active middleware's centre runs (compose profiles).
      zenoh-router: {condition: service_started, required: false}
      dds-discovery: {condition: service_started, required: false}
