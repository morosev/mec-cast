# Lab role: edge — the MEC application server behind the UPF.
#
# Hosts the Zenoh router (the rendezvous point the UE dials into) and the
# ingest node that stamps arrival and computes latency.
#
# Also hosts the admin service: the control plane belongs on the management
# LAN beside the edge, not across the UPF (same reasoning as ADR-0003 for PTP).
#
# Required env: LOGGING_HOST. RUN_ID is required only without the admin —
# with ADMIN_URL set the admin names the runs, so it defaults to empty.
services:
  zenoh-router:
    image: mec-cast-ros
    build:
      context: ../..
      dockerfile: deploy/docker/ros.Dockerfile
    network_mode: host
    command: ros2 run rmw_zenoh_cpp rmw_zenohd
    environment:
      ZENOH_ROUTER_CONFIG_URI: /zenoh/router-config.json5
    restart: unless-stopped

  edge:
    image: mec-cast-ros
    network_mode: host
    # PUBLISH_RESULT sends the processed cloud back down for the UE's
    # renderer. Off unless asked for: it changes what the edge does with
    # every frame, and campaigns recorded without it must stay comparable.
    command: >
      ros2 run mec_cast_edge edge --ros-args
      -p publish_result:=${PUBLISH_RESULT:-false}
      -p result_reliability:=${RESULT_RELIABILITY:-best_effort}
      -p result_qos_depth:=${RESULT_QOS_DEPTH:-1}
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_SESSION_CONFIG_URI: /zenoh/session-config.json5
      ZENOH_ROUTER_CHECK_ATTEMPTS: "-1"
      RUN_ID: ${RUN_ID:-}
      RUNS_DIR: /runs
      LOGGING_URL: http://${LOGGING_HOST:?set LOGGING_HOST}:8000
      ADMIN_URL: ${ADMIN_URL:-ws://127.0.0.1:8099/ws/node}
    volumes:
      - ../../runs:/runs
      - /dev/ptp0:/dev/ptp0
    devices:
      - /dev/ptp0
    depends_on:
      - zenoh-router

  admin:
    build:
      context: ../../services/admin
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY pyproject.toml README.md ./
        COPY src ./src
        RUN pip install --no-cache-dir .
        EXPOSE 8099
        CMD ["mec-cast-admin", "serve", "--host", "0.0.0.0", "--port", "8099"]
    network_mode: host
    environment:
      MECADM_RUNS_DIR: /runs
      MECADM_LOGGING_URL: http://${LOGGING_HOST:?set LOGGING_HOST}:8000
    volumes:
      # The manifests live here, on the edge host. Each node's CSVs live on
      # its own machine — the admin records which, in the manifest's `sites`.
      - ../../runs:/runs
    restart: unless-stopped
