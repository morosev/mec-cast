#
# mec-cast lab PTP configuration.
# Hardware timestamping, IEEE 802.3 transport (-2), slave-only endpoints.
#
[global]
# 1 = hardware timestamping. Falls back only if the NIC cannot do it.
time_stamping           hardware

# Endpoints are slaves; the grandmaster is dedicated hardware or a
# GPS-disciplined source on the management LAN.
slaveOnly               1

# Tighter than defaults: we care about sub-microsecond phase alignment.
logSyncInterval         -3
logMinDelayReqInterval  -3
logAnnounceInterval     1

# Peer-to-peer delay mechanism suits a switched lab fabric.
delay_mechanism         E2E
network_transport       L2

# Log the offset so verify-ptp.sh and journalctl can see convergence.
summary_interval        0
