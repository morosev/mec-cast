# Lab role: infra — the admin control plane, logging service and PostgreSQL,
# shared by every other role.
#
# Deploy this first: the UE, edge, and gNB roles all POST snapshots here and
# will buffer-then-drop if it is unreachable.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mec_cast_logs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` succeeds whenever the server is up, even if mec_cast_logs
      # was never created — which happens when the volume already holds an
      # initialised data dir, since the image then skips initdb. The logging
      # service would start on `service_healthy` and exit 3. Prove the database.
      test: ["CMD-SHELL", "psql -U postgres -d mec_cast_logs -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  logging:
    build:
      context: ${MECLOG_BUILD_CONTEXT:-../../services/logging}
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY pyproject.toml README.md LICENSE ./
        COPY src ./src
        RUN pip install --no-cache-dir .
        EXPOSE 8000
        CMD ["mec-cast-logs", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MECLOG_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mec_cast_logs
      MECLOG_AUTO_MIGRATE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Periodic pg_dump to a directory on the HOST, not into a volume. The whole
  # point is to survive the volume: `down -v`, a prune, or a disk swap all
  # take pgdata with them, and a backup living inside it would go too.
  #
  # BACKUP_DIR must stay OUTSIDE ~/mec-cast. deploy.sh rsyncs that tree with
  # --delete, so a backup directory inside it is erased by the next deploy --
  # silently, and exactly when you are most likely to want it.
  backup:
    image: postgres:16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: postgres
      POSTGRES_DB: mec_cast_logs
      # How often to dump. 7d by default; accepts 7d / 24h / 90m / 3600s.
      BACKUP_EVERY: ${BACKUP_EVERY:-7d}
      # How many dumps to keep. Eight weeklies is roughly two months.
      BACKUP_KEEP: ${BACKUP_KEEP:-8}
      # How often to check whether one is due. Not the backup interval.
      BACKUP_CHECK_EVERY: ${BACKUP_CHECK_EVERY:-1h}
    volumes:
      - ${BACKUP_DIR:-/var/backups/mec-cast}:/backups
      - ./pg-backup.sh:/pg-backup.sh:ro
    entrypoint: ["/bin/bash", "/pg-backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The control plane. It lives here rather than on the edge because runs are
  # per cell and there must be ONE authority for the fleet: an admin per edge
  # would give each cell its own registry, its own runs/ directory and its own
  # half of the declared topology, with no way to start a run spanning cells.
  #
  # Ports rather than network_mode: host, matching logging and postgres on
  # this role. It reaches the logging service by its compose service name;
  # every node reaches it at ${LOGGING_HOST}:8099.
  admin:
    build:
      context: ../../services/admin
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY pyproject.toml README.md ./
        COPY src ./src
        RUN pip install --no-cache-dir .
        EXPOSE 8099
        CMD ["mec-cast-admin", "serve", "--host", "0.0.0.0", "--port", "8099"]
    environment:
      MECADM_RUNS_DIR: /runs
      MECADM_LOGGING_URL: http://logging:8000
    ports:
      - "8099:8099"
    volumes:
      # Run manifests live here now, on infra, beside the database that holds
      # the telemetry for the same runs. Each node's CSVs stay on its own
      # machine — the manifest's `sites` records which.
      - ../../runs:/runs
      # The declared topology, if there is one. Directory rather than file:
      # a bind whose source file is missing makes compose create a directory
      # in its place, which would then break every deployment that has not
      # declared one.
      - ../../deploy/lab:/etc/mec-cast:ro
    depends_on:
      - logging
    restart: unless-stopped

volumes:
  pgdata:
