# Lab role: UE — LiDAR + compute machine behind the 5G modem.
#
# Unlike the local topology there is no netem here: the impairment is the
# real 5G uplink. The Zenoh router lives on the edge host, so this node
# dials out to it across the UPF (which is exactly why Zenoh was chosen
# over multicast DDS discovery — see docs/architecture/adr/0001).
#
# Required env: EDGE_HOST, INFRA_HOST (RUN_ID only without the admin)
# Optional: LIDAR_INSTANCES (default 1), RENDER_INSTANCES (default 0),
# RENDER_SINK (null | rerun | ros), VIEWER_HOST (the address the operator's
# BROWSER reaches this UE on — localhost is wrong the moment it is another
# machine). A renderer needs PUBLISH_RESULT=1 on the edge role or it sits
# starved — the admin page says so with WF_RENDER_STARVED. A renderer on a
# UE with no lidar loses the PTP-free round trip: WF_RENDER_CROSS_HOST.
services:
  # The UE agent: every UE node type in one ROS2 process — N lidar instances
  # and, when RENDER_INSTANCES > 0, M render instances beside them. One robot,
  # one process, however many sensors and displays it carries. Each instance
  # keeps a distinct node_id (client-<host>-<i>) and output directory
  # (pub-0, pub-1, ...). The renderer needs PUBLISH_RESULT=1 on the edge role
  # or it sits starved — the admin page says so with WF_RENDER_STARVED.
  ue-agent:
    image: mec-cast-ros
    build:
      context: ../..
      dockerfile: deploy/docker/ros.Dockerfile
    network_mode: host
    command: >
      ros2 run mec_cast_ue ue_agent --ros-args
      -p lidar_count:=${LIDAR_INSTANCES:-1}
      -p render_count:=${RENDER_INSTANCES:-0}
      -p num_points:=${NUM_POINTS:-5000}
      -p rate_hz:=${RATE_HZ:-10.0}
      -p seed:=${SEED:-42}
      -p pattern:=${PATTERN:-uniform_cube}
      -p sink:=${RENDER_SINK:-null}
      -p viewer_host:=${VIEWER_HOST:-localhost}
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_ROUTER_CHECK_ATTEMPTS: "-1"
      # Dial the router on the edge host across the 5G user plane. The
      # scheme must match what the router listens on — udp/...?rel=1 per
      # ADR-0006. It said tcp/ here, which no router in this repo accepts.
      ZENOH_CONFIG_OVERRIDE: 'connect/endpoints=["udp/${EDGE_HOST}:7447?rel=1"]'
      RUN_ID: ${RUN_ID:-}
      # The admin runs on the infra host; without it the node needs RUN_ID.
      # `-` not `:-`: an explicitly empty ADMIN_URL means "no control
      # plane, take the run id from RUN_ID", and `:-` cannot express
      # that because it substitutes the default for empty as well as
      # unset. See operations/deploy-manual.md.
      ADMIN_URL: ${ADMIN_URL-ws://${INFRA_HOST:?set INFRA_HOST}:8099/ws/node}
      RUNS_DIR: /runs
      LOGGING_URL: http://${INFRA_HOST:?set INFRA_HOST}:8000
      # Which radio cell this node reports. Empty unless the deployment
      # declares a topology; see docs/operations/admin-service.md.
      CELL: ${CELL:-}
    volumes:
      - ../../runs:/runs
      # Read the PTP hardware clock for capture timestamps.
      - /dev/ptp0:/dev/ptp0
    devices:
      - /dev/ptp0

  # The renderer is no longer a separate service: RENDER_INSTANCES=1 (with
  # RENDER_SINK=rerun to actually draw) hosts it inside ue-agent above,
  # co-located with the lidar — which is what keeps its e2e_ns the PTP-free
  # round trip of ADR-0009. Both capture_ns and process_done_ns then come off
  # this one host's CLOCK_REALTIME.
