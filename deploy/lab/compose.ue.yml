# Lab role: UE — LiDAR + compute machine behind the 5G modem.
#
# Unlike the local topology there is no netem here: the impairment is the
# real 5G uplink. The middleware's centre lives on the edge host -- the Zenoh
# router, or the Fast DDS Discovery Server (ADR-0013) -- so this node dials out
# to it across the UPF; multicast DDS discovery would not cross it (ADR-0001).
#
# Required env: EDGE_HOST, INFRA_HOST (RUN_ID only without the admin)
# Optional: LIDAR_INSTANCES (default 1), RENDER_INSTANCES (default 0),
# RENDER_SINK (null | rerun | ros), VIEWER_HOST (the address the operator's
# BROWSER reaches this UE on — LEAVE IT UNSET. rerun's gRPC proxy sends
# access-control-allow-origin only for loopback origins, so the viewer is
# reached through an ssh tunnel and localhost is the correct value; a routable
# address gives a page that loads and is then refused its own stream). A renderer needs PUBLISH_RESULT=1 on the edge role or it sits
# starved — the admin page says so with WF_RENDER_STARVED. A renderer on a
# UE with no lidar loses the PTP-free round trip: WF_RENDER_CROSS_HOST.
services:
  # The UE agent: every UE node type in one ROS2 process — N lidar instances
  # and, when RENDER_INSTANCES > 0, M render instances beside them. One robot,
  # one process, however many sensors and displays it carries. Each instance
  # keeps a distinct node_id (client-<host>-<i>) and output directory
  # (pub-0, pub-1, ...). The renderer needs PUBLISH_RESULT=1 on the edge role
  # or it sits starved — the admin page says so with WF_RENDER_STARVED.
  ue-agent:
    image: mec-cast-ros
    build:
      context: ../..
      dockerfile: deploy/docker/ros.Dockerfile
      # Stamped into the image's OCI labels and its runtime environment, so a
      # host can say what it is running and the admin can compare. deploy.sh
      # forwards these; a hand-run build without them gets `unknown`.
      args:
        VCS_REF: ${VCS_REF:-unknown}
        VERSION: ${VERSION:-unknown}
    network_mode: host
    command: >
      ros2 run mec_cast_ue ue_agent --ros-args
      -p lidar_count:=${LIDAR_INSTANCES:-1}
      -p render_count:=${RENDER_INSTANCES:-0}
      -p num_points:=${NUM_POINTS:-5000}
      -p rate_hz:=${RATE_HZ:-10.0}
      -p seed:=${SEED:-42}
      -p pattern:=${PATTERN:-uniform_cube}
      -p sink:=${RENDER_SINK:-null}
      -p viewer_host:=${VIEWER_HOST:-localhost}
    environment:
      # Zenoh (tcp|quic) or Fast DDS (udp|tcp), the same on every host,
      # resolved by the image's entrypoint (ADR-0013). Either way this node
      # dials the edge's centre across the 5G user plane: the Zenoh router,
      # which relays every sample, or the Fast DDS Discovery Server, after
      # which data flows directly between participants (the UE's address must
      # be routable from the edge).
      MIDDLEWARE: ${MIDDLEWARE:-zenoh}
      MIDDLEWARE_LINK: ${MIDDLEWARE_LINK:-}
      MIDDLEWARE_HOST: ${EDGE_HOST}
      # dds: this UE's 5G interface (or address) only. Fast DDS announces
      # every interface; with the management LAN among them the point clouds
      # could reach the edge without crossing the 5G link at all.
      DDS_INTERFACES: ${DDS_INTERFACES:-}
      RUN_ID: ${RUN_ID:-}
      # The admin runs on the infra host; without it the node needs RUN_ID.
      # `-` not `:-`: an explicitly empty ADMIN_URL means "no control
      # plane, take the run id from RUN_ID", and `:-` cannot express
      # that because it substitutes the default for empty as well as
      # unset. See operations/deploy-manual.md.
      ADMIN_URL: ${ADMIN_URL-ws://${INFRA_HOST:?set INFRA_HOST}:8099/ws/node}
      RUNS_DIR: /runs
      LOGGING_URL: http://${INFRA_HOST:?set INFRA_HOST}:8000
      # Which zone (a gNB, its UEs and its edge) this node reports. Empty
      # unless the deployment declares a topology; see
      # docs/operations/admin-service.md.
      ZONE: ${ZONE:-}
      # Always the in-container path: the bind mount above maps whatever the
      # host calls its PHC onto /dev/ptp0 here. Empty would disable the
      # monitor, which is what shipped for the platform's whole life.
      PTP_DEVICE: /dev/ptp0
    volumes:
      - ../../runs:/runs
    devices:
      # The host PHC, always presented as /dev/ptp0 INSIDE the container, so
      # only this line is host-specific and the node's config is uniform.
      # Default index 0 is whichever NIC the driver registered first, which on
      # a multi-NIC host is routinely not the one ptp4l disciplines -- set
      # PTP_DEVICE per host to the right clock (`ethtool -T <iface>` names the
      # index). An explicit target is required: the single-path form maps
      # host:host, leaving the container without the path it was told to open.
      - ${PTP_DEVICE:-/dev/ptp0}:/dev/ptp0

  # The renderer is no longer a separate service: RENDER_INSTANCES=1 (with
  # RENDER_SINK=rerun to actually draw) hosts it inside ue-agent above,
  # co-located with the lidar — which is what keeps its e2e_ns the PTP-free
  # round trip of ADR-0009. Both capture_ns and process_done_ns then come off
  # this one host's CLOCK_REALTIME.
