# Logging backend: mec-cast-logging-service + PostgreSQL.
#
# Run from the repo root, usually via the Makefile:
#   make up-logging          # or:
#   docker compose -f deploy/compose/logging.yml up -d --build
#
# The build context is the services/logging submodule (initialise it with
# `git submodule update --init services/logging`). To build from a separate
# working tree instead — e.g. testing an unpushed change to the service:
#   MECLOG_BUILD_CONTEXT=../../../mec-cast-logging-service make up-logging
# See docs/operations/logging-submodule.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mec_cast_logs
    # A named volume rather than the image's implicit anonymous one: anonymous
    # volumes survive `down` and can be re-attached to a later container, so an
    # already-initialised data dir makes the image skip initdb and POSTGRES_DB
    # is never created. `down -v` removes this one deterministically.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` only proves the SERVER accepts connections — it succeeds
      # even when mec_cast_logs does not exist. The logging service then starts
      # on `condition: service_healthy`, fails to connect, and exits 3 while
      # compose still reports the stack up. Prove the database itself.
      test: ["CMD-SHELL", "psql -U postgres -d mec_cast_logs -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 15

  logging:
    build:
      context: ${MECLOG_BUILD_CONTEXT:-../../services/logging}
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY pyproject.toml README.md LICENSE ./
        COPY src ./src
        RUN pip install --no-cache-dir .
        EXPOSE 8000
        CMD ["mec-cast-logs", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MECLOG_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mec_cast_logs
      MECLOG_AUTO_MIGRATE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
