# Profile A over a software 5G link on ONE Ubuntu host:
#   UE agent --tun_srsue--> srsUE ~ZMQ~ OCUDU gNB --GTP-U--> Open5GS UPF --N6--> edge
#
# Unlike local.yml there is no netem sidecar: the impairment is the 5G stack.
# The roles mirror the lab (deploy/lab/compose.{edge,ue}.yml), collapsed onto
# one host:
#
#   zenoh-router, edge, ran-collector   network_mode: host -> the N6 side,
#                                       reached from the UPF at N6_ADDR
#   lidar-client                        its own netns; srsUE puts tun_srsue in
#                                       it, and only N6_ADDR is routed via 5G
#   logging, admin                      compose bridge = the management LAN
#
# Prerequisites and the full procedure (OCUDU gNB, srsUE, Open5GS core, the
# netns hand-over to srsUE) are in docs/guides/local-5g-ocudu.md.
#
# Use WITH logging.yml and admin.yml, this file LAST. `make up-local-5g`
# (RAN=1 for the metrics tap) does that, and passes the VCS_REF/VERSION build
# args a bare `docker compose up --build` would reset to `unknown`.
#
# The UE waits until N6_ADDR routes via tun_srsue before it opens its Zenoh
# session, so it can never silently take the bridge shortcut instead of 5G.
# Until then the admin shows no UE node. `make attach-local-5g`
# (scripts/ocudu-attach-ue.sh) creates that route, and must be re-run after
# every srsUE/gNB restart and every recreate of lidar-client.
#
# Knobs: NUM_POINTS (5000), RATE_HZ (10.0), SEED (42), PATTERN, RELIABILITY,
#        QOS_DEPTH, LIDAR_INSTANCES, N6_ADDR (10.53.1.1 = this host on the
#        Open5GS docker bridge), GNB_METRICS_SOURCE / GNB_METRICS_WS (ran)
services:
  zenoh-router:
    image: mec-cast-ros
    build:
      context: ../..
      dockerfile: deploy/docker/ros.Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
        VERSION: ${VERSION:-unknown}
    network_mode: host
    command: ros2 run rmw_zenoh_cpp rmw_zenohd
    environment:
      ZENOH_ROUTER_CONFIG_URI: /zenoh/router-config.json5
    volumes:
      - ../docker/zenoh/tls:/zenoh/tls:ro

  edge:
    image: mec-cast-ros
    network_mode: host
    # reliability MUST match lidar-client: a BEST_EFFORT publisher and a
    # RELIABLE subscriber are incompatible and deliver nothing, silently.
    command: >
      ros2 run mec_cast_edge edge --ros-args
      -p reliability:=${RELIABILITY:-reliable}
      -p qos_depth:=${QOS_DEPTH:-10}
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      # Loopback: the router runs beside this node under network_mode: host.
      ZENOH_CONFIG_OVERRIDE: 'mode="client";connect/endpoints=["tcp/127.0.0.1:7448"]'
      ZENOH_ROUTER_CHECK_ATTEMPTS: "-1"
      RUN_ID: ${RUN_ID:-}
      RUNS_DIR: /runs
      # Host networking has no compose DNS: use the published ports.
      LOGGING_URL: http://127.0.0.1:8000
      ADMIN_URL: ws://127.0.0.1:8099/ws/node
      CELL: ${CELL:-}
      # No PTP here (single host, often a VM). Empty disables the monitor
      # instead of failing on a /dev/ptp0 that does not exist.
      PTP_DEVICE: ""
    volumes:
      - ../../runs:/runs
    depends_on:
      - zenoh-router

  lidar-client:
    image: mec-cast-ros
    # Matches local.yml, so the node is client-ue-local-0.
    hostname: ue-local
    # Stays on the compose bridge for logging/admin (management plane). The
    # data plane goes to the router at N6_ADDR, and that ONE address is routed
    # through tun_srsue once srsUE is attached to this container's netns.
    cap_add:
      - NET_ADMIN
    command:
      - bash
      - -c
      - |
        until ip route get ${N6_ADDR:-10.53.1.1} | grep -q tun_srsue; do
          echo "waiting for the 5G link: ${N6_ADDR:-10.53.1.1} does not route via tun_srsue yet"
          sleep 2
        done
        echo "5G link up: $$(ip route get ${N6_ADDR:-10.53.1.1})"
        exec ros2 run mec_cast_ue ue_agent --ros-args \
          -p lidar_count:=${LIDAR_INSTANCES:-1} \
          -p render_count:=0 \
          -p num_points:=${NUM_POINTS:-5000} \
          -p rate_hz:=${RATE_HZ:-10.0} \
          -p seed:=${SEED:-42} \
          -p pattern:=${PATTERN:-uniform_cube} \
          -p reliability:=${RELIABILITY:-reliable} \
          -p qos_depth:=${QOS_DEPTH:-10}
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_CONFIG_OVERRIDE: 'mode="client";connect/endpoints=["tcp/${N6_ADDR:-10.53.1.1}:7448"]'
      ZENOH_ROUTER_CHECK_ATTEMPTS: "-1"
      RUN_ID: ${RUN_ID:-}
      RUNS_DIR: /runs
      LOGGING_URL: http://logging:8000
      ADMIN_URL: ws://admin:8099/ws/node
      ADMIN_AUTOSTART: "false"
      CELL: ${CELL:-}
      PTP_DEVICE: ""
    volumes:
      - ../../runs:/runs
      - ../docker/zenoh/tls:/zenoh/tls:ro

  # Optional gNB metrics tap: start with `--profile ran`. Needs the gNB's JSON
  # metrics over its remote_control WebSocket (127.0.0.1:8001); see
  # deploy/lab/srsran/gnb.mec-cast.yml and docs/guides/local-5g-ocudu.md.
  ran-collector:
    image: mec-cast-ran
    profiles: ["ran"]
    build:
      context: ../..
      dockerfile: deploy/docker/ran.Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
        VERSION: ${VERSION:-unknown}
    network_mode: host
    environment:
      RUN_ID: ${RUN_ID:-}
      ADMIN_URL: ws://127.0.0.1:8099/ws/node
      RUNS_DIR: /runs
      LOGGING_URL: http://127.0.0.1:8000
      CELL: ${CELL:-}
      PTP_DEVICE: ""
      GNB_METRICS_SOURCE: ${GNB_METRICS_SOURCE:-ws}
      GNB_METRICS_ADDR: 0.0.0.0:${METRICS_PORT:-55555}
      GNB_METRICS_WS: ${GNB_METRICS_WS:-127.0.0.1:8001}
    volumes:
      - ../../runs:/runs
