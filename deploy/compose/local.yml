# Local topology (Profile A): zenoh router <- lidar client (+netem sidecar) -> edge.
# The netem sidecar shares the client's network namespace and impairs its
# egress — modelling the 5G uplink leg without touching host networking.
#
# Run from the repo root, usually via the Makefile:
#   make up-local            # or:
#   RUN_ID=$(uuidgen) docker compose \
#     -f deploy/compose/logging.yml -f deploy/compose/local.yml up -d --build
#
# Knobs: RUN_ID, NETEM_DELAY (20ms), NETEM_JITTER (5ms), NETEM_LOSS (0.5%),
#        NUM_POINTS (5000), RATE_HZ (10.0), SEED (42),
#        PATTERN (uniform_cube | rotating_plane | sphere | lidar_scan),
#        RELIABILITY (reliable | best_effort), QOS_DEPTH (10)
services:
  zenoh-router:
    image: mec-cast-ros
    build:
      context: ../..
      dockerfile: deploy/docker/ros.Dockerfile
      # Without these, `compose up --build` rebuilds the image with the
      # Dockerfile's `unknown` defaults and overwrites whatever
      # `make build-ros2` stamped. The Makefile exports both; a bare
      # `docker compose` outside make falls back to `unknown` honestly
      # rather than inheriting a stale value.
      args:
        VCS_REF: ${VCS_REF:-unknown}
        VERSION: ${VERSION:-unknown}
    command: ros2 run rmw_zenoh_cpp rmw_zenohd
    environment:
      ZENOH_ROUTER_CONFIG_URI: /zenoh/router-config.json5

  lidar-client:
    image: mec-cast-ros
    # The UE agent: N lidar instances in one process (M1 of the extended node
    # model). LIDAR_INSTANCES=1 reproduces the old single-node behaviour —
    # global -p args reach every instance, and each instance gets a distinct
    # node_id / output dir (pub-0, pub-1, ...) via admin_instance overrides.
    #
    # hostname matches the render overlay's on purpose: these two containers
    # model ONE UE host split for isolation, and they share the kernel clock —
    # so node identity (client-<host>-<i>) and the WF_RENDER_CROSS_HOST
    # co-location check must see one host, not two random container ids.
    hostname: ue-local
    command: >
      ros2 run mec_cast_ue ue_agent --ros-args
      -p lidar_count:=${LIDAR_INSTANCES:-1}
      -p render_count:=0
      -p num_points:=${NUM_POINTS:-5000}
      -p rate_hz:=${RATE_HZ:-10.0}
      -p seed:=${SEED:-42}
      -p pattern:=${PATTERN:-uniform_cube}
      -p reliability:=${RELIABILITY:-reliable}
      -p qos_depth:=${QOS_DEPTH:-10}
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_SESSION_CONFIG_URI: /zenoh/session-config.json5
      ZENOH_ROUTER_CHECK_ATTEMPTS: "-1"
      RUN_ID: ${RUN_ID:-dev-run}
      RUNS_DIR: /runs
      LOGGING_URL: http://logging:8000
      # Which radio cell this node reports. Empty unless the deployment
      # declares a topology; see docs/operations/admin-service.md.
      CELL: ${CELL:-}
    volumes:
      - ../../runs:/runs
    depends_on:
      - zenoh-router

  # Impairs everything the lidar client sends (it shares its netns).
  netem:
    image: mec-cast-ros
    network_mode: "service:lidar-client"
    cap_add:
      - NET_ADMIN
    command: >
      bash -c "tc qdisc replace dev eth0 root netem
      delay ${NETEM_DELAY:-20ms} ${NETEM_JITTER:-5ms}
      loss ${NETEM_LOSS:-0.5%}
      && echo netem applied: delay=${NETEM_DELAY:-20ms} jitter=${NETEM_JITTER:-5ms} loss=${NETEM_LOSS:-0.5%}
      && sleep infinity"
    depends_on:
      - lidar-client

  edge:
    image: mec-cast-ros
    # A stable hostname, so the node_id is `edge-mec-local-0` rather than a
    # container id that changes on every recreate. Without it a declared
    # topology could never name this node — the lab does not need it because
    # network_mode: host gives the containers real hostnames.
    hostname: mec-local
    # reliability MUST match lidar-client: a BEST_EFFORT publisher and a
    # RELIABLE subscriber are incompatible and deliver nothing, silently.
    command: >
      ros2 run mec_cast_edge edge --ros-args
      -p reliability:=${RELIABILITY:-reliable}
      -p qos_depth:=${QOS_DEPTH:-10}
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_SESSION_CONFIG_URI: /zenoh/session-config.json5
      ZENOH_ROUTER_CHECK_ATTEMPTS: "-1"
      RUN_ID: ${RUN_ID:-dev-run}
      RUNS_DIR: /runs
      LOGGING_URL: http://logging:8000
      CELL: ${CELL:-}
    volumes:
      - ../../runs:/runs
    depends_on:
      - zenoh-router
