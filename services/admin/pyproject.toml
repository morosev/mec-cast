[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mec-cast-admin-service"
version = "0.1.0"
description = "Run orchestration for mec-cast: a WebSocket control plane and operator page."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
mec-cast-admin = "mec_cast_admin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mec_cast_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
