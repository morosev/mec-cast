name: release

# A pushed tag is not a GitHub Release: the tag is a pointer in the repo, the
# Release is a separate object with notes. Nothing creates one implicitly, so
# this does.
#
# A SEPARATE workflow rather than a job in platform.yml, because that one is
# path-filtered. When `paths:` is present, a tag push has to satisfy it too,
# and the filter is evaluated against the pushed commits -- so whether a
# release happened would depend on which files the tagged commit touched.
# Nothing here needs a path filter, and coupling the two would make the
# release the unreliable half.

on:
  push:
    tags: ["platform-v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Creating a release writes to the repository. The default token is
      # read-only on repositories configured that way, and the failure reads
      # as a 403 from gh rather than as a missing permission.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # actions/checkout fetches with --no-tags by default, so the tag
          # OBJECT never reaches the runner -- only the commit it points at.
          # gh then finds no annotation and silently falls back to the commit
          # message, which is how v0.4.1 first shipped with the wrong notes.
          # fetch-depth alone does not cover this.
          fetch-tags: true

      - name: Create the release from the tag's own message
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Idempotent: re-running the workflow, or force-pushing a tag,
          # must not fail the run over a release that already exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — nothing to do"
            exit 0
          fi

          # Re-fetch the tag by explicit refspec. Belt and braces over
          # fetch-tags: this is the one thing the whole job depends on, and
          # the failure is silent -- a release appears, with the wrong notes.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

          # Read the annotation ourselves rather than trusting --notes-from-tag
          # to find it, so that a lightweight tag FAILS here instead of
          # quietly publishing the commit message as the release note.
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > /tmp/notes.txt
          if [ "$(git cat-file -t "$TAG")" != tag ] || [ ! -s /tmp/notes.txt ]; then
            echo "::error::$TAG is not an annotated tag, or its message is empty." >&2
            echo "Release notes come from the tag: git tag -a $TAG -F notes.txt" >&2
            exit 1
          fi

          echo "notes (first line): $(head -1 /tmp/notes.txt)"

          # --verify-tag refuses to invent a tag that is not on the remote.
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file /tmp/notes.txt

          echo "created release $TAG"
