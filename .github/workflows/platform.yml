name: platform

# Path-filtered so that pushes touching only the legacy WebRTC client or the
# docs do not rebuild the ROS image. The legacy client has no build job at
# all: compiling libwebrtc needs a ~20 GB checkout and hours, so it is an
# opt-in local/lab target only (docs/guides/building-libwebrtc.md).

on:
  push:
    branches: [main]
    # NOTE: GitHub Actions does not support YAML anchors, so this list is
    # duplicated below rather than aliased. Keep the two in sync.
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - "telemetry/**"
      - "ran/**"
      - "ros2/**"
      - "deploy/**"
      - "tests/e2e/**"
      - "scripts/**"
      - ".github/workflows/platform.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - "telemetry/**"
      - "ran/**"
      - "ros2/**"
      - "deploy/**"
      - "tests/e2e/**"
      - "scripts/**"
      - ".github/workflows/platform.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo clippy -p mec-cast-telemetry --all-targets --features linux-ptp,pyo3 -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --no-default-features

  pybind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin pytest
      - run: maturin build --release -o dist
        working-directory: telemetry/python
      - run: pip install telemetry/python/dist/*.whl
      - run: pytest telemetry/python/tests -v

  ros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/ros.Dockerfile -t mec-cast-ros .
      - name: colcon test (launch_testing)
        run: bash deploy/docker/run-ros-tests.sh

  ran-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/ran.Dockerfile -t mec-cast-ran .

  # Full netem e2e needs NET_ADMIN and ~2 min of runtime: main/nightly only.
  e2e:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [rust, ros]
    steps:
      # Only the small submodules: third_party/webrtc is ~20 GB and nothing
      # in CI builds it.
      - uses: actions/checkout@v4
      - run: git submodule update --init services/logging
      - name: Fall back to a sibling checkout if the submodule is empty
        run: |
          if [ ! -f services/logging/pyproject.toml ]; then
            git clone --depth 1 \
              https://github.com/morosev/mec-cast-logging-service.git \
              ../mec-cast-logging-service
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # The image built by the `ros` job lives on a different runner, so it
      # is not available here. `make test-e2e` depends on build-ros2 for the
      # same reason; build it explicitly so CI matches the local target.
      - name: Build the ROS image
        run: docker build -f deploy/docker/ros.Dockerfile -t mec-cast-ros .
      - run: pytest tests/e2e -v
      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/logging.yml \
                         -f deploy/compose/local.yml ps -a || true
          docker compose -f deploy/compose/logging.yml \
                         -f deploy/compose/local.yml logs --tail 100 || true

  # Publish the container images so every lab host pulls one identical build.
  #
  # This is a measurement concern, not a convenience: deploy/lab/deploy.sh
  # builds on each host, so the UE and the edge can end up running images that
  # differ in base-image digest or package versions. One published digest
  # removes that variable from every result — and turns a ~1.4 GB build per
  # host into a pull.
  #
  # Gated on the test jobs: an image whose pipeline test failed must not reach
  # a registry that four lab hosts pull from.
  publish-images:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [rust, ros, ran-image, e2e]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      # Plain docker login rather than a third-party action: GITHUB_TOKEN is
      # already scoped by the permissions block above, so no extra secret.
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT=$(git rev-parse --short HEAD)
          # Stamped into OCI labels so `make version` on a lab host can tell
          # whether the container it is running came from the checkout sitting
          # next to it. Tags can be re-pointed; the label cannot.
          VERSION=$(git describe --tags --match 'platform-v*' --always)

          for spec in "ros:deploy/docker/ros.Dockerfile" \
                      "ran:deploy/docker/ran.Dockerfile"; do
            name="mec-cast-${spec%%:*}"
            file="${spec#*:}"
            image="$REGISTRY/$OWNER/$name"
            echo "==> $image  ($VERSION)"
            # :main always points at the newest build; the sha tag is what a
            # run.json can cite and a lab host can pin to.
            docker build -f "$file" \
              --build-arg "VCS_REF=$(git rev-parse HEAD)" \
              --build-arg "VERSION=$VERSION" \
              -t "$image:main" -t "$image:sha-$SHORT" .
            docker push "$image:main"
            docker push "$image:sha-$SHORT"
          done

      - name: Summary
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT=$(git rev-parse --short HEAD)
          {
            echo "### Images published"
            echo
            echo '```bash'
            for n in mec-cast-ros mec-cast-ran; do
              echo "docker pull $REGISTRY/$OWNER/$n:sha-$SHORT"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
